# 测试专用配置 —— 只覆盖需要改的项，其余继承 src/main/resources/application.properties。
#
# 为什么 datasource 要加 `${random.uuid}`：
#
# 各 Spring context 的**种子**（`DevSeedConfig` / `CreditConfig` / ... 的 ApplicationRunner）
# 只在**该 context 创建时**跑一次；而 H2 是 `jdbc:h2:mem:evolutionary;DB_CLOSE_DELAY=-1`
# —— **全 JVM 共用一个库**。两者一叠加就有了一个隐蔽的顺序依赖：
#
#   1. 某个 @AutoConfigureMockMvc 测试建了 context A（种子写入共享库）
#   2. 另一批 @SpringBootTest 的 JPA 测试（context B）`deleteAllInBatch()` 清表
#   3. 后续测试复用**缓存**的 context A —— 但它的种子已被步骤 2 清掉，且**不会再跑**
#      → 于是 `GET /credit/profiles/U1` 报 404
#
# 实测（2026-09-19）：`FormalLiveContractTest.creditProfileU1Ok` 与
# `CreditControllerTest.profileAndStatementsForU1` 两条红，单跑不复现、
# 只在全量顺序下出现 —— 正是这类"测过了"和"根本没测"难分的失效。
#
# `${random.uuid}` 由 Spring 的 RandomValuePropertySource 提供，**每个 context 的
# Environment 各解析一次** → 每个 context 一个独立的库。
# 这恢复了本该有的不变量：**context 自包含** —— 一个 context 的种子只归它自己，
# 别的 context 清表也影响不到。
#
# 注意：这是**测试专用**配置。main 的 application.properties 保持不变。
spring.datasource.url=jdbc:h2:mem:evolutionary-${random.uuid};DB_CLOSE_DELAY=-1;MODE=PostgreSQL
